[project]
name = "sharing"
version = "0.1.0"
description = "Multi-org data sharing with delegated agent credentials: Postgres RLS, short-lived scoped delegation chains, and an adversarial suite"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "python-dotenv>=1.0",
    "typer>=0.15",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-timeout>=2.3",
    "ruff>=0.8",
]

[project.scripts]
portal = "sharing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 300
addopts = "-q"
# The repo root is on the path so tests import the same `attacks` package the
# reported numbers come from, rather than reimplementing the attacks.
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# In the privilege tests, `with connect(...)` wrapping `with pytest.raises(...)`
# reads better than one combined statement: the connection is the fixture and the
# raises block is the assertion. Combining them obscures which is which.
"tests/*" = ["SIM117"]
